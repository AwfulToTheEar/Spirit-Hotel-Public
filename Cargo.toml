version = "0.1.0"
edition = "2024"

[dependencies]
bevy-inspector-egui = "0.35.0"
bevy_mod_debugdump = "0.14.0"
bevy = { workspace = true }
bevy_light_2d = { workspace = true }
bevy_northstar = { workspace = true }

spirit_hotel_core = { workspace = true }
spirit_hotel_player = { workspace = true }
spirit_hotel_pathfinding = { workspace = true }
spirit_hotel_animation = { workspace = true }
spirit_hotel_level = { workspace = true }
spirit_hotel_scene = { workspace = true }
spirit_hotel_trigger = { workspace = true }
spirit_hotel_movement = { workspace = true }
spirit_hotel_dialogue = { workspace = true }
spirit_hotel_lighting = { workspace = true }
spirit_hotel_animation_movement = { workspace = true }
spirit_hotel_dialogue_trigger = { workspace = true }
spirit_hotel_level_animation = { workspace = true }
spirit_hotel_level_movement = { workspace = true }
spirit_hotel_level_pathfinding = { workspace = true }
spirit_hotel_level_player = { workspace = true }
spirit_hotel_level_trigger = { workspace = true }
spirit_hotel_level_scene = { workspace = true }
spirit_hotel_movement_trigger = { workspace = true }
spirit_hotel_pathfinding_movement = { workspace = true }
spirit_hotel_pathfinding_movement_trigger = { workspace = true }
spirit_hotel_pathfinding_trigger = { workspace = true }
spirit_hotel_player_movement = { workspace = true }
spirit_hotel_scene_dialogue = { workspace = true }
spirit_hotel_scene_trigger = { workspace = true }

[patch.crates-io]
#bevy_ecs_tiled = { path = "crates/bevy_ecs_tiled" }
#bevy_aseprite_ultra = { path = "crates/bevy_aseprite_ultra" }
#bevy_light_2d = { path = "crates/bevy_light_2d" }

# Your web builds will start failing if you add a dependency that pulls in `getrandom` v0.3+.
# To fix this, you should tell `getrandom` to use the `wasm_js` backend on Wasm.
# See: <https://docs.rs/getrandom/0.3.3/getrandom/#webassembly-support>.
#[target.wasm32-unknown-unknown.dependencies]
#getrandom = { version = "0.3", features = ["wasm_js"] }
# In addition to enabling the `wasm_js` feature, you need to include `--cfg 'getrandom_backend="wasm_js"'`
# in your rustflags for both local and CI/CD web builds, taking into account that rustflags specified in
# multiple places are NOT combined (see <https://github.com/rust-lang/cargo/issues/5376>).
# Alternatively, you can opt out of the rustflags check with this patch:
#[patch.crates-io]
#getrandom = { git = "https://github.com/benfrankel/getrandom" }
[workspace]
members = ["crates/spirit_hotel*"]

[workspace.dependencies]
bevy = { version = "0.17.3", features = ["wayland"] }
avian2d = "0.4.1"
bevy_aseprite_ultra = "0.7.0"
bevy_yarnspinner = "0.6.0"
bevy_yarnspinner_example_dialogue_view = "0.6.0"
bevy_ecs_tiled = { version = "0.10.0", features = ["avian_debug", "user_properties"] }
bevy_light_2d = "0.8.0"
bevy_ecs_tilemap = "0.17.0"
bevy_northstar = "0.5.0"
bevy_enhanced_input = "0.20.0"

spirit_hotel_core = { path = "crates/spirit_hotel_core" }
spirit_hotel_player = { path = "crates/spirit_hotel_player" }
spirit_hotel_pathfinding = { path = "crates/spirit_hotel_pathfinding" }
spirit_hotel_animation = { path = "crates/spirit_hotel_animation" }
spirit_hotel_level = { path = "crates/spirit_hotel_level" }
spirit_hotel_scene = { path = "crates/spirit_hotel_scene" }
spirit_hotel_trigger = { path = "crates/spirit_hotel_trigger" }
spirit_hotel_movement = { path = "crates/spirit_hotel_movement" }
spirit_hotel_dialogue = { path = "crates/spirit_hotel_dialogue" }
spirit_hotel_lighting = { path = "crates/spirit_hotel_lighting" }
spirit_hotel_animation_movement = { path = "crates/spirit_hotel_animation_movement" }
spirit_hotel_dialogue_trigger = { path = "crates/spirit_hotel_dialogue_trigger" }
spirit_hotel_level_animation = { path = "crates/spirit_hotel_level_animation" }
spirit_hotel_level_movement = { path = "crates/spirit_hotel_level_movement" }
spirit_hotel_level_pathfinding = { path = "crates/spirit_hotel_level_pathfinding" }
spirit_hotel_level_player = { path = "crates/spirit_hotel_level_player" }
spirit_hotel_level_trigger = { path = "crates/spirit_hotel_level_trigger" }
spirit_hotel_level_scene = { path = "crates/spirit_hotel_level_scene" }
spirit_hotel_movement_trigger = { path = "crates/spirit_hotel_movement_trigger" }
spirit_hotel_pathfinding_movement = { path = "crates/spirit_hotel_pathfinding_movement" }
spirit_hotel_pathfinding_movement_trigger = { path = "crates/spirit_hotel_pathfinding_movement_trigger" }
spirit_hotel_pathfinding_trigger = { path = "crates/spirit_hotel_pathfinding_trigger" }
spirit_hotel_player_movement = { path = "crates/spirit_hotel_player_movement" }
spirit_hotel_scene_dialogue = { path = "crates/spirit_hotel_scene_dialogue" }
spirit_hotel_scene_trigger = { path = "crates/spirit_hotel_scene_trigger" }


[features]
# Default to a native dev build.
default = ["dev_native"]
dev = [
    # Improve compile times for dev builds by linking Bevy as a dynamic library.
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    # Improve error events coming from Bevy
    "bevy/track_location",
]
dev_native = [
    "dev",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
]


[package.metadata.bevy_cli.release]
# Disable dev features for release builds.
default-features = false

[package.metadata.bevy_cli.web]
# Disable native features for web builds.
default-features = false

[package.metadata.bevy_cli.web.dev]
features = ["dev"]


[lints.rust]
# Mark `bevy_lint` as a valid `cfg`, as it is set when the Bevy linter runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"

# You can configure the warning levels of Bevy lints here. For a list of all lints, see:
# <https://thebevyflock.github.io/bevy_cli/bevy_lint/lints/>
[package.metadata.bevy_lint]
# panicking_methods = "deny"
# pedantic = "warn"


# Compile with Performance Optimizations:
# <https://bevyengine.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations>

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# This profile will be used by `bevy run web` automatically.
[profile.web-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
